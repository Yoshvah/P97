nelmio_cors:
    defaults:
        allow_origin: ['*']  # Allows all domains (can be restrictive, so adjust accordingly)
        allow_headers: ['Content-Type', 'Authorization']
        expose_headers: []
        allow_methods: ['GET', 'POST', 'PUT', 'DELETE', 'OPTIONS']
        max_age: 3600  # Cache preflight request for 1 hour
    paths:
        '^/api/':  # Apply CORS settings to all API endpoints
            allow_origin: ['*']  # Adjust this to restrict origins if needed
            allow_headers: ['Content-Type', 'Authorization']
            allow_methods: ['GET', 'POST', 'PUT', 'DELETE', 'OPTIONS']
            max_age: 3600
